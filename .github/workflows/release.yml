name: Package and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  package-and-release:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt
          pip install flake8

      - name: Verify the application
        run: |
          python -m py_compile audio_transcriber.py key_slide_extractor.py local_video_analyzer.py local_screen_recorder.py gemini_hybrid_analyzer.py launcher.py
          flake8 audio_transcriber.py key_slide_extractor.py local_video_analyzer.py local_screen_recorder.py gemini_hybrid_analyzer.py launcher.py tests --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m unittest discover -s tests -v

      - name: Prepare source package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_package | Out-Null
          $files = @(
            'Start.bat',
            'launcher.py',
            'local_screen_recorder.py',
            'local_video_analyzer.py',
            'gemini_hybrid_analyzer.py',
            'audio_transcriber.py',
            'key_slide_extractor.py',
            'requirements.txt',
            'requirements-local.txt',
            'requirements-app.txt',
            'README.md',
            'manual.pdf',
            'manual_EN.pdf',
            'LICENSE',
            '.env.example'
          )
          Copy-Item -Path $files -Destination release_package
          Compress-Archive -Path release_package\* -DestinationPath Gemini-Video-Analyzer-Windows.zip

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-Video-Analyzer-Windows
          path: Gemini-Video-Analyzer-Windows.zip
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Gemini-Video-Analyzer-Windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
