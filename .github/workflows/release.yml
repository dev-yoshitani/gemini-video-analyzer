name: Package and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  package-and-release:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure release does not already exist (Release immutability check)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "::error::Release '${{ github.ref_name }}' already exists. Overwriting an existing release or mutating tags is strictly prohibited."
            echo "::error::Please bump the patch version (e.g. v2.3.1) and push a new tag."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt
          pip install flake8

      - name: Verify the application
        run: |
          python -m py_compile audio_compression.py audio_transcriber.py key_slide_extractor.py local_video_analyzer.py local_screen_recorder.py gemini_hybrid_analyzer.py gemini_retry.py launcher.py desktop_app.py timeline_analysis.py recording_recovery.py workflow_control.py
          flake8 audio_compression.py audio_transcriber.py key_slide_extractor.py local_video_analyzer.py local_screen_recorder.py gemini_hybrid_analyzer.py gemini_retry.py launcher.py desktop_app.py timeline_analysis.py recording_recovery.py workflow_control.py tests --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m unittest discover -s tests -v

      - name: Prepare Japanese and English packages
        run: python tools/package_release.py --output dist

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-Video-Analyzer-Windows
          path: |
            dist/Gemini-Video-Analyzer-Windows-Japanese.zip
            dist/Gemini-Video-Analyzer-Windows-English.zip
            dist/SHA256SUMS.txt
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Gemini-Video-Analyzer-Windows-Japanese.zip
            dist/Gemini-Video-Analyzer-Windows-English.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
